<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radar and forecast layers test: BOM tiles (v3)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html,body{height:100%;margin:0;font:13px/1.35 system-ui,Segoe UI,Arial,sans-serif;background:#12151a;color:#d8dde6}
  #bar{padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:#1b2028;border-bottom:1px solid #2c3440}
  #bar label{display:flex;align-items:center;gap:5px;white-space:nowrap}
  #bar button,#bar select,#bar input[type=text]{background:#2a3340;color:#e6eaf0;border:1px solid #3a4553;border-radius:4px;padding:3px 8px}
  #maps{display:flex;height:calc(100% - 210px)}
  .pane{position:relative;flex:1;min-width:0}
  .pane + .pane{border-left:2px solid #000}
  .map{position:absolute;inset:0}
  .tag{position:absolute;z-index:1000;left:56px;top:8px;background:rgba(18,21,26,.88);padding:4px 8px;border-radius:5px;font-weight:600;pointer-events:none}
  #status{height:150px;overflow:auto;padding:6px 10px;background:#161a20;border-top:1px solid #2c3440;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap}
  .ok{color:#7fd88a}.bad{color:#ff8f8f}.warn{color:#f0c36a}
  .leaflet-container{background:#0d1014}
</style>
</head>
<body>
<div id="bar">
  <strong>BOM tile test v3</strong>
  <label>Layer <select id="layer"></select></label>
  <label>Basemap
    <select id="base">
      <option value="dark">Esri dark grey</option>
      <option value="light">Esri light grey</option>
      <option value="ocean">Esri ocean</option>
    </select></label>
  <label>Opacity <input id="opa" type="range" min="10" max="100" value="80"></label>
  <label><input id="rvon" type="checkbox" checked> RainViewer (left pane)</label>
  <button id="play">Play</button>
  <label>Time <input id="frame" type="range" min="0" max="8" value="8" style="width:200px"><span id="ftime"></span></label>
  <label><input id="edges" type="checkbox"> Show tile edges</label>
  <label>Force start time (UTC) <input id="force" type="text" placeholder="2026-11-21T00:15Z" size="18"></label>
  <button id="links">List tile links for this view</button>
  <button id="reload">Re-probe &amp; reload</button>
</div>
<div id="maps">
  <div class="pane"><div class="tag" id="tagL">RainViewer (latest frame)</div><div id="mapL" class="map"></div></div>
  <div class="pane"><div class="tag" id="tagR">BOM tiles (api.bom.gov.au)</div><div id="mapR" class="map"></div></div>
</div>
<div id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
//--PURE-START  (no browser objects below this line until PURE-END; these functions are unit tested)
var BOM = {
  base: 'https://api.bom.gov.au/apikey/v1/mapping/timeseries/wmts/1.0.0',
  R: 6378137.0,
  // Both tile grids copied from the service's capabilities document (saved 21 Nov 2026). Each zoom: [top-left Y, matrix width, matrix height].
  GRIDS: {"GoogleMapsCompatible_BoM": {"X0": 11584952.0, "Z": {"0": [34168990.685578, 1, 1], "1": [14131482.342789, 1, 1], "2": [4112728.171395, 1, 1], "3": [4112728.171395, 2, 2], "4": [1608039.628546, 3, 3], "5": [355695.357122, 6, 5], "6": [-270476.778591, 11, 9], "7": [-583562.846447, 22, 17], "8": [-740105.880375, 43, 33]}}, "GoogleMapsCompatible_BoM_ADFD": {"X0": 12462758.1832, "Z": {"0": [34449560.527478, 1, 1], "1": [14412052.184689, 1, 1], "2": [4393298.013295, 1, 1], "3": [-616079.072403, 1, 1], "4": [-616079.072403, 2, 2], "5": [-616079.072403, 4, 4], "6": [-616079.072403, 8, 8], "7": [-616079.072403, 16, 16], "8": [-772622.106331, 31, 31]}}},
  MAXZ: 8
};
// Layers worth trying. kind: '5min' = radar, 3h = three-hourly forecast, daily = one a day (anchorH = the UTC hour its time stamps use)
var LAYERS = [
  { id:'atm_surf_air_precip_reflectivity_dbz',                           label:'Radar: reflectivity (dBZ)',              grid:'main', kind:'5min' },
  { id:'atm_surf_air_precip_rate_1hr_total_mm_h',                        label:'Radar: rain rate (mm/h)',                grid:'main', kind:'5min' },
  { id:'atm_surf_air_temp_heatwave_severity_code_daily',                 label:'Heatwave severity (daily)',              grid:'adfd', kind:'daily', anchorH:0 },
  { id:'atm_surf_air_weather_icon_thunderstorm_code_3hourly',            label:'Thunderstorms (3-hourly)',               grid:'adfd', kind:'3h' },
  { id:'atm_surf_air_precip_any_probability_percent_3hourly',            label:'Chance of any rain % (3-hourly)',        grid:'adfd', kind:'3h' },
  { id:'atm_surf_air_precip_any_probability_percent_daily',              label:'Chance of any rain % (daily)',           grid:'adfd', kind:'daily', anchorH:15 },
  { id:'atm_surf_air_precip_exceeding_50percentchance_total_mm_3hourly', label:'Rain amount with 50% chance (3-hourly)', grid:'adfd', kind:'3h' },
  { id:'atm_surf_air_precip_exceeding_10percentchance_total_mm_3hourly', label:'Rain amount with 10% chance (3-hourly)', grid:'adfd', kind:'3h' },
  { id:'atm_surf_air_temp_max_cel_daily',                                label:'Maximum temperature (daily)',            grid:'adfd', kind:'daily', anchorH:0 },
  { id:'atm_surf_air_temp_apparent_cel_3hourly',                         label:'Feels-like temperature (3-hourly)',      grid:'adfd', kind:'3h' },
  { id:'atm_surf_air_wind_speed_10m_avg_kmh_3hourly',                    label:'Wind speed km/h (3-hourly)',             grid:'adfd', kind:'3h' },
  { id:'atm_surf_air_weather_icon_frost_code_3hourly',                   label:'Frost (3-hourly)',                       grid:'adfd', kind:'3h' },
  { id:'atm_surf_air_weather_icon_fog_code_3hourly',                     label:'Fog (3-hourly)',                         grid:'adfd', kind:'3h' }
];
var GRID_SET = { main: 'GoogleMapsCompatible_BoM', adfd: 'GoogleMapsCompatible_BoM_ADFD' };
function bomGrid(g){ return BOM.GRIDS[GRID_SET[g || 'main']]; }
function bomRes(z){ return 156543.03392804097 / Math.pow(2, z); }           // projected metres per pixel
function bomTileBounds3857(z, row, col, g){                                 // [xmin, ymin, xmax, ymax] in EPSG:3857 metres
  var G = bomGrid(g), tm = bomRes(z) * 256, x0 = G.X0 + col * tm, yTop = G.Z[z][0] - row * tm;
  return [x0, yTop - tm, x0 + tm, yTop];
}
function m2ll(x, y){ return [ (2 * Math.atan(Math.exp(y / BOM.R)) - Math.PI / 2) * 180 / Math.PI, x / BOM.R * 180 / Math.PI ]; }
function ll2m(lat, lon){ return [ lon * Math.PI / 180 * BOM.R, Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) * BOM.R ]; }
function bomTileLatLngBounds(z, row, col, g){                               // [[south, west], [north, east]]
  var b = bomTileBounds3857(z, row, col, g), sw = m2ll(b[0], b[1]), ne = m2ll(b[2], b[3]);
  return [sw, ne];
}
function bomTileForPoint(lat, lon, z, g){                                   // which tile holds a point (may lie outside the matrix)
  var G = bomGrid(g), m = ll2m(lat, lon), tm = bomRes(z) * 256;
  return { row: Math.floor((G.Z[z][0] - m[1]) / tm), col: Math.floor((m[0] - G.X0) / tm) };
}
function bomVisibleTiles(z, south, west, north, east, g){                   // tiles intersecting a lat/lon view, clipped to the matrix
  var G = bomGrid(g), def = G.Z[z], a = ll2m(south, west), b = ll2m(north, east), tm = bomRes(z) * 256, out = [];
  var c0 = Math.floor((a[0] - G.X0) / tm), c1 = Math.floor((b[0] - G.X0) / tm);
  var r0 = Math.floor((def[0] - b[1]) / tm), r1 = Math.floor((def[0] - a[1]) / tm);
  c0 = Math.max(0, c0); r0 = Math.max(0, r0); c1 = Math.min(def[1] - 1, c1); r1 = Math.min(def[2] - 1, r1);
  for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) out.push({ z: z, row: r, col: c });
  return out;
}
function bomStamp(ms, secs){                                                // "2026-11-20T23:40Z" (as BOM's page writes it); secs=true gives "...T23:40:00Z"
  var d = new Date(ms), p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + 'T' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + (secs ? ':00' : '') + 'Z';
}
function bomTileUrl(layer, stamp, z, row, col, g){
  return BOM.base + '/' + layer + '/default/' + stamp + '/' + GRID_SET[g || 'main'] + '/' + z + '/' + row + '/' + col + '.png';
}
function bomFrames(newestMs, n){                                            // radar: oldest first, 5-minute steps
  var out = []; for (var i = n - 1; i >= 0; i--) out.push(newestMs - i * 300000); return out;
}
var H3 = 10800000, DAY = 86400000;
function bomLayerTimes(kind, anchorH, nowMs, n){                            // forecast layers: the times to offer, earliest first
  var out = [], i, t;
  if (kind === '3h') { t = Math.floor(nowMs / H3) * H3; for (i = 0; i < n; i++) out.push(t + i * H3); }   // starts at the slot that contains 'now'
  else if (kind === 'daily') { var a = anchorH * 3600000; t = Math.floor((nowMs - a) / DAY) * DAY + a; for (i = 0; i < n; i++) out.push(t + i * DAY); }
  return out;
}
function bomZoomFor(mapZoom){ return Math.max(0, Math.min(BOM.MAXZ, Math.round(mapZoom))); }
//--PURE-END
</script>

<script>
(function(){
  var logEl = document.getElementById('status');
  function log(msg, cls, url){
    var s = document.createElement('div'); if (cls) s.className = cls; s.textContent = new Date().toISOString().slice(11,19) + '  ' + msg + (url ? '  ' : '');
    if (url) { var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '[open this tile]'; a.style.color = '#8ab4ff'; s.appendChild(a); }
    logEl.appendChild(s); logEl.scrollTop = logEl.scrollHeight;
  }
  var sel = document.getElementById('layer');
  LAYERS.forEach(function(l){ var o = document.createElement('option'); o.value = l.id; o.textContent = l.label; sel.appendChild(o); });
  function curDef(){ return LAYERS.filter(function(l){ return l.id === sel.value; })[0]; }

  var BASES = {
    dark:  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',  max: 16 },
    light: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', max: 16 },
    ocean: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',        max: 10 }
  };
  var ATTR = 'Basemap &copy; Esri | Radar and forecasts: Bureau of Meteorology; radar (left): <a href="https://www.rainviewer.com/" target="_blank">RainViewer</a>';
  var mapL = L.map('mapL', { center: [-33.9, 151.0], zoom: 8, maxZoom: 12, minZoom: 4 });
  var mapR = L.map('mapR', { center: [-33.9, 151.0], zoom: 8, maxZoom: 12, minZoom: 4 });
  var baseL, baseR;
  function setBase(){
    var b = BASES[document.getElementById('base').value];
    if (baseL) mapL.removeLayer(baseL); if (baseR) mapR.removeLayer(baseR);
    baseL = L.tileLayer(b.url, { maxNativeZoom: b.max, maxZoom: 12, attribution: ATTR }).addTo(mapL); baseL.setZIndex(1);
    baseR = L.tileLayer(b.url, { maxNativeZoom: b.max, maxZoom: 12, attribution: ATTR }).addTo(mapR); baseR.setZIndex(1);
  }
  setBase(); document.getElementById('base').onchange = setBase;
  var syncing = false;
  function link(a, b){ a.on('moveend zoomend', function(){ if (syncing) return; syncing = true; b.setView(a.getCenter(), a.getZoom(), { animate: false }); syncing = false; }); }
  link(mapL, mapR); link(mapR, mapL);

  // ---------- LEFT: RainViewer, latest frame only ----------
  var rvLayer = null, rvOk = 0, rvBad = 0;
  function opa(){ return +document.getElementById('opa').value / 100; }
  function applyRv(){ if (rvLayer) rvLayer.setOpacity(document.getElementById('rvon').checked ? opa() : 0); }
  function loadRainViewer(){
    if (rvLayer) { mapL.removeLayer(rvLayer); rvLayer = null; } rvOk = rvBad = 0;
    fetch('https://api.rainviewer.com/public/weather-maps.json').then(function(r){ return r.json(); }).then(function(d){
      var past = d.radar.past, f = past[past.length - 1];
      rvLayer = L.tileLayer(d.host + f.path + '/512/{z}/{x}/{y}/2/0_0.png', { tileSize: 512, zoomOffset: -1, maxNativeZoom: 8, maxZoom: 12, opacity: opa() });
      rvLayer.on('tileload', function(){ rvOk++; }); rvLayer.on('tileerror', function(){ rvBad++; });
      rvLayer.addTo(mapL); rvLayer.setZIndex(5); applyRv();
      document.getElementById('tagL').textContent = 'RainViewer, frame generated ' + new Date(f.time * 1000).toLocaleTimeString('en-AU', { hour12: false, timeZone: 'Australia/Sydney' }) + ' AEDT';
      log('RainViewer: ' + past.length + ' frames listed; showing the newest.', 'ok');
    }).catch(function(e){ log('RainViewer failed: ' + e, 'bad'); });
  }

  // ---------- RIGHT: BOM tiles drawn at their true positions ----------
  var frames = [], frameIdx = 0, tiles = [], playing = false, timer = null, ok = 0, bad = 0, fmtSecs = false, edgeLayer = L.layerGroup();
  function stampOf(i){ return bomStamp(frames[i], fmtSecs); }
  function probeImage(url, ms){
    return new Promise(function(res){
      var im = new Image(), done = false, t = setTimeout(function(){ if (!done) { done = true; res(false); } }, ms || 8000);
      im.onload = function(){ if (!done) { done = true; clearTimeout(t); res(true); } };
      im.onerror = function(){ if (!done) { done = true; clearTimeout(t); res(false); } };
      im.src = url;
    });
  }
  function probeTile(def){                                                  // a real tile under the map centre at zoom 7, inside the layer's grid
    var c = mapR.getCenter(), t = bomTileForPoint(c.lat, c.lng, 7, def.grid), d = bomGrid(def.grid).Z[7];
    return { z: 7, row: Math.max(0, Math.min(d[2] - 1, t.row)), col: Math.max(0, Math.min(d[1] - 1, t.col)) };
  }
  async function probeNewestRadar(def){
    var base = Math.floor(Date.now() / 300000) * 300000, t = probeTile(def);
    for (var k = 0; k <= 9; k++) {
      var ms = base - k * 300000, stamp = bomStamp(ms), url = bomTileUrl(def.id, stamp, t.z, t.row, t.col, def.grid);
      var okp = await probeImage(url);
      if (!okp) { var u0 = bomTileUrl(def.id, stamp, 0, 0, 0, def.grid); okp = await probeImage(u0); if (okp) url = u0; }
      log('probe ' + stamp + (okp ? '  available' : '  not available'), okp ? 'ok' : 'warn', url);
      if (okp) return ms;
    }
    return null;
  }
  // Forecast layers: find the first time that answers, and whether the address wants seconds in the time stamp.
  async function probeForecast(def, times){
    var t = probeTile(def);
    for (var i = 0; i < Math.min(4, times.length); i++) {
      for (var s = 0; s < 2; s++) {
        var secs = s === 1, url = bomTileUrl(def.id, bomStamp(times[i], secs), t.z, t.row, t.col, def.grid), okp = await probeImage(url);
        log('probe ' + bomStamp(times[i], secs) + (okp ? '  available' : '  not available'), okp ? 'ok' : 'warn', url);
        if (okp) return { idx: i, secs: secs };
      }
    }
    return null;
  }

  function clearTiles(){ tiles.forEach(function(t){ mapR.removeLayer(t.o); }); tiles = []; edgeLayer.clearLayers(); }
  function wanted(){
    var b = mapR.getBounds(), def = curDef();
    return bomVisibleTiles(bomZoomFor(mapR.getZoom()), b.getSouth(), b.getWest(), b.getNorth(), b.getEast(), def.grid);
  }
  function key(t, fi){ return fi + '|' + t.z + '/' + t.row + '/' + t.col; }
  function syncTiles(){
    if (!frames.length) return;
    var def = curDef(), want = wanted(), keep = {};
    var fis = (playing && def.kind === '5min') ? frames.map(function(_, i){ return i; }) : [frameIdx];
    fis.forEach(function(fi){ want.forEach(function(t){ keep[key(t, fi)] = { t: t, fi: fi }; }); });
    tiles = tiles.filter(function(x){ if (keep[x.k]) return true; mapR.removeLayer(x.o); return false; });
    var have = {}; tiles.forEach(function(x){ have[x.k] = true; });
    Object.keys(keep).forEach(function(k){
      if (have[k]) return;
      var t = keep[k].t, fi = keep[k].fi, bb = bomTileLatLngBounds(t.z, t.row, t.col, def.grid);
      var o = L.imageOverlay(bomTileUrl(def.id, stampOf(fi), t.z, t.row, t.col, def.grid), bb, { opacity: fi === frameIdx ? opa() : 0, zIndex: 6, interactive: false });
      o.on('load', function(){ ok++; updateStatus(); });
      o.on('error', function(){ bad++; if (bad <= 5) log('BOM tile failed: ' + o._url, 'bad', o._url); updateStatus(); });
      o.addTo(mapR); tiles.push({ k: k, o: o, fi: fi });
    });
    edgeLayer.clearLayers();
    if (document.getElementById('edges').checked) {
      want.forEach(function(t){ L.rectangle(bomTileLatLngBounds(t.z, t.row, t.col, def.grid), { weight: 1, color: '#ffcc00', fill: false, interactive: false }).addTo(edgeLayer); });
      edgeLayer.addTo(mapR);
    } else { mapR.removeLayer(edgeLayer); }
    setOpacity(); updateStatus();
  }
  function setOpacity(){ tiles.forEach(function(x){ x.o.setOpacity(x.fi === frameIdx ? opa() : 0); }); applyRv(); }
  function fmtLocal(ms){ return new Date(ms).toLocaleString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Australia/Sydney' }) + ' AEDT'; }
  function showFrame(i){
    frameIdx = i; document.getElementById('frame').value = i;
    document.getElementById('ftime').textContent = ' ' + fmtLocal(frames[i]) + ' (' + stampOf(i) + ')';
    document.getElementById('tagR').textContent = 'BOM: ' + curDef().label + ', ' + fmtLocal(frames[i]);
    syncTiles();
  }
  function updateStatus(){
    var c = mapR.getCenter(), z = bomZoomFor(mapR.getZoom()), m = bomRes(z) * Math.cos(c.lat * Math.PI / 180);
    var s = document.getElementById('readout'); if (!s) { s = document.createElement('div'); s.id = 'readout'; s.style.cssText = 'position:sticky;top:0;background:#161a20;padding-bottom:4px;border-bottom:1px solid #2c3440;margin-bottom:4px'; logEl.prepend(s); }
    s.textContent = 'Map zoom ' + mapR.getZoom() + '  |  BOM tile zoom ' + z + (mapR.getZoom() > BOM.MAXZ ? ' (stretched: service stops at ' + BOM.MAXZ + ')' : '') +
      '  |  one BOM pixel is about ' + Math.round(m) + ' m on the ground here  |  BOM tiles loaded ' + ok + ', failed ' + bad + '  |  RainViewer tiles loaded ' + rvOk + ', failed ' + rvBad;
  }

  async function startBom(){
    stopPlay(); clearTiles(); ok = bad = 0; frames = []; fmtSecs = false;
    var def = curDef(), forced = document.getElementById('force').value.trim(), forcedMs = (forced && !isNaN(Date.parse(forced))) ? Date.parse(forced) : null;
    document.getElementById('rvon').checked = (def.kind === '5min'); applyRv();
    var slider = document.getElementById('frame');
    if (def.kind === '5min') {
      var newest;
      if (forcedMs !== null) { newest = forcedMs; log('Using the time you typed: ' + forced, 'warn'); }
      else { log('Probing for the newest published frame of ' + def.label + '…'); newest = await probeNewestRadar(def); }
      if (newest === null) { log('No frame answered. Either the service refuses this page (see the browser console) or it is offline.', 'bad'); return; }
      frames = bomFrames(newest, 9); slider.max = 8; showFrame(8);
      log('Using frames ' + bomStamp(frames[0]) + ' to ' + bomStamp(frames[8]) + ' (the service lists 9 frames, 45 minutes).', 'ok');
    } else {
      var times = bomLayerTimes(def.kind, def.anchorH || 0, forcedMs !== null ? forcedMs : Date.now(), def.kind === 'daily' ? 7 : 40);
      log('Probing ' + def.label + ' (' + def.grid + ' grid)…');
      var hit = await probeForecast(def, times);
      if (!hit) { log('No time answered for this layer, in either time format. Open one of the links above to see what the service says.', 'bad'); return; }
      fmtSecs = hit.secs; frames = times; slider.max = times.length - 1; showFrame(hit.idx);
      log('Time format that works: ' + (fmtSecs ? 'with seconds (…T21:00:00Z)' : 'without seconds (…T21:00Z)') + '. Offering ' + times.length + ' times from ' + bomStamp(times[0], fmtSecs) + '.', 'ok');
    }
  }
  function stopPlay(){ playing = false; clearInterval(timer); document.getElementById('play').textContent = 'Play'; }
  document.getElementById('opa').oninput = setOpacity;
  document.getElementById('rvon').onchange = applyRv;
  document.getElementById('frame').oninput = function(){ if (frames.length) { stopPlay(); showFrame(+this.value); } };
  document.getElementById('edges').onchange = syncTiles;
  sel.onchange = function(){ startBom(); };
  document.getElementById('reload').onclick = function(){ loadRainViewer(); startBom(); };
  document.getElementById('links').onclick = function(){
    if (!frames.length) { log('Nothing loaded yet.', 'warn'); return; }
    var def = curDef(); wanted().forEach(function(t){ log('tile ' + t.z + '/' + t.row + '/' + t.col + ' for ' + stampOf(frameIdx), '', bomTileUrl(def.id, stampOf(frameIdx), t.z, t.row, t.col, def.grid)); });
  };
  document.getElementById('play').onclick = function(){
    if (!frames.length) return;
    if (playing) { stopPlay(); return; }
    playing = true; this.textContent = 'Pause'; syncTiles();
    var i = frameIdx, ms = curDef().kind === '5min' ? 600 : 900;
    timer = setInterval(function(){ i = (i + 1) % frames.length; showFrame(i); }, ms);
  };
  mapR.on('moveend zoomend', function(){ syncTiles(); });

  loadRainViewer(); startBom();
  log('Tip: if BOM tiles fail here but work on bom.gov.au, the service is refusing this page address. That is a finding, not a bug.');
})();
</script>
</body>
</html>
