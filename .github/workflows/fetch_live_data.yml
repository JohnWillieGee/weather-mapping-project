name: Fetch Live Weather Data

on:
  workflow_dispatch:


jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Kill job if it hangs — prevents blocking the queue

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test BOM FTP access
        run: |
          curl -s --ftp-pasv ftp://ftp.bom.gov.au/anon/gen/fwo/IDD10731.xml -o /tmp/ftp_test.xml
          if [ -s /tmp/ftp_test.xml ]; then
            echo "BOM FTP OK — $(wc -c < /tmp/ftp_test.xml) bytes retrieved"
          else
            echo "WARNING: BOM FTP returned empty file or failed"
          fi

      - name: Fetch live data
        run: python fetch_live_data.py

      - name: Commit and push live_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_data.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "chore: update live_data.json [skip ci]"
          git push --set-upstream origin main || true
